<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Dodger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Menu Screen -->
  <div id="menu">
    <h1>SPACE DODGER</h1>
    <div class="subtitle">DODGE. SURVIVE. CONQUER.</div>
    <p id="walletStatus">Not connected</p>
    <button id="connectBtn">
      <span>💼</span> CONNECT WALLET
    </button>
    <button id="startBtn">
      <span>▶</span> START GAME
    </button>
  </div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Game Over Screen -->
  <div id="gameOver" style="display:none;">
    <h2>GAME OVER</h2>
    <p id="finalScore">Score: 0</p>
    <p id="finalTime">Time: 0s</p>
    <button id="retryBtn">PLAY AGAIN</button>
    <button id="menuBtn">MAIN MENU</button>
    <p id="tx" style="margin-top:20px;"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
