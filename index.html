<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Dodger - GenLayer</title>

  <link rel="stylesheet" href="style.css">

  <!-- ethers -->
  <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js"></script>
</head>

<body>

  <!-- MENU -->
  <div id="menu">
    <!-- hidden wallet text (used by JS only) -->
    <p id="walletStatus"></p>

    <!-- invisible buttons (aligned with background image) -->
    <button id="connectBtn"></button>
    <button id="startBtn"></button>
  </div>

  <!-- GAME -->
  <canvas id="gameCanvas"></canvas>

  <!-- GAME OVER -->
  <div id="gameOver" style="display:none;">
    <h2>GAME OVER</h2>
    <p id="finalScore">Score: 0</p>
    <p id="finalTime">Time: 0s</p>

    <button id="retryBtn">PLAY AGAIN</button>
    <button id="menuBtn">MAIN MENU</button>

    <p id="tx" style="margin-top:20px;"></p>
  </div>

  <script src="script.js?v=100"></script>

</body>
</html>
